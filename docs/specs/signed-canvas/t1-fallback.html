<!doctype html><html><head><meta charset="utf-8"><title>T-1 fallback</title></head>
<body><pre id="o">…</pre><script type="module">
import * as ed from "./noble-ed25519.js";
const out=[];
const B58="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const b58=(b)=>{let n=0n;for(const x of b)n=(n<<8n)|BigInt(x);let s="";while(n>0n){s=B58[Number(n%58n)]+s;n/=58n;}return s;};
const b64url=(u)=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const hex=(h)=>Uint8Array.from(h.match(/../g).map(b=>parseInt(b,16)));

// #318 vectors
const SEED="0101010101010101010101010101010101010101010101010101010101010101";
const WANT_DID="did:key:z6Mkon3Necd6NkkyfoGoHxid2znGc59LU3K7mubaRcFbLfLX";
const PAYLOAD="lobby|1|hello bob";
const WANT_SIG="yaj5d9zmPbK3lYHMHVbcn0kSJTr5cMOlW7ZxEntH4HbdzknoUiVEuxsv9QWcxsddTmAUwmgeA9JpAgZFXF6rDA";

try{
  const priv=hex(SEED);
  const pub=await ed.getPublicKeyAsync(priv);
  const did="did:key:z"+b58(new Uint8Array([0xed,0x01,...pub]));
  out.push((did===WANT_DID?"PASS":"FAIL")+"  did:key derived from seed");
  out.push("        "+did);
  const sig=b64url(await ed.signAsync(new TextEncoder().encode(PAYLOAD),priv));
  out.push((sig===WANT_SIG?"PASS":"FAIL")+"  signature matches #318 vector");
  if(sig!==WANT_SIG) out.push("        got "+sig);
  const ok=await ed.verifyAsync(Uint8Array.from(atob(WANT_SIG.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0)),
                                new TextEncoder().encode(PAYLOAD),pub);
  out.push((ok?"PASS":"FAIL")+"  verifies the published signature");
  // hiz: 20 imza
  const t=performance.now();
  for(let i=0;i<20;i++) await ed.signAsync(new TextEncoder().encode("canvas|"+i+"|px 1,1 3 abc"),priv);
  out.push("····  20 signatures in "+(performance.now()-t).toFixed(0)+" ms");
}catch(e){ out.push("FAIL  "+e.name+": "+e.message); }
const f=out.filter(r=>r.startsWith("FAIL")).length;
document.getElementById("o").textContent=out.join("\n")+"\n\n"+(f?f+" FAILURE(S)":"ALL PASS");
</script></body></html>
