<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signed Canvas — palette in axonometric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&display=swap">
<style>
:root{
  --plot-10:#EDF2F4; --plot-20:#FBFDFD; --plot-30:#7FBFCF;
  --plot-40:#0B8FA8; --plot-100:#0F2A33; --plot-line:#C3D3D9;
  --current-color-10:var(--plot-10); --current-color-20:var(--plot-20);
  --current-color-30:var(--plot-30); --current-color-40:var(--plot-40);
  --current-color-100:var(--plot-100); --current-line:var(--plot-line);
  --font-baslik:'Archivo','Helvetica Now Display',system-ui,sans-serif;
  --font-mikro:'Martian Mono',ui-monospace,'Cascadia Mono',monospace;
  --t-mikro:11px; --s-2:16px; --s-3:32px; --r:0px;
  --d-kucuk:.2s; --ease:cubic-bezier(.59,.06,.1,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--current-color-10);color:var(--current-color-100);
  font-family:var(--font-baslik);padding:var(--s-3) var(--s-3) 48px;-webkit-font-smoothing:antialiased}
.mikro{font-family:var(--font-mikro);font-size:var(--t-mikro);letter-spacing:.2em;
  text-transform:uppercase;color:var(--current-color-40)}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:.95;margin:8px 0 4px}
.alt{font-family:var(--font-mikro);font-size:11px;letter-spacing:.06em;
  color:var(--current-color-100);opacity:.65;max-width:70ch;line-height:1.7;margin-bottom:var(--s-3)}
.sahne{background:var(--current-color-20);border:1px solid var(--current-line);
  border-radius:var(--r);padding:var(--s-2);position:relative}
.sahne::after{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;
  border-top:2px solid var(--current-color-40);border-right:2px solid var(--current-color-40)}
canvas{display:block;width:100%;height:auto;image-rendering:auto}
.serit{display:flex;gap:3px;margin-top:var(--s-2)}
.cip{flex:1;height:26px;border-radius:var(--r);position:relative}
.cip span{position:absolute;bottom:-15px;left:0;font-family:var(--font-mikro);font-size:8px;
  color:var(--current-color-100);opacity:.5}
.uc{display:flex;justify-content:space-between;margin-top:24px;
  font-family:var(--font-mikro);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--current-color-100);opacity:.5}
.olcu{display:flex;gap:var(--s-3);margin-top:26px;flex-wrap:wrap}
.olcu div{font-family:var(--font-mikro);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--current-color-100);opacity:.7}
.olcu b{color:var(--current-color-40)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<span class="mikro" id="etiket">palette</span>
<h1 id="baslik">—</h1>
<p class="alt" id="aciklama">—</p>
<div class="sahne"><canvas id="c" width="1560" height="800"></canvas>
  <div class="serit" id="serit"></div>
  <div class="uc"><span>hot &nbsp;·&nbsp; 01</span><span>15 &nbsp;·&nbsp; cold</span></div>
</div>
<div class="olcu" id="olcu"></div>

<script>
/* Axonometric because the identity is a technical drawing: the PLOT way of showing depth
   is a projection, not a perspective camera. Cells rise with contest count — how many
   times a cell has been overwritten — so a contested region becomes terrain. */

const N = 64;               // canvas is 64x64 (NFR-7)
const TW = 22, TH = 11;     // tile width / height in the 2:1 axonometric
const LIFT = 7;             // pixels of rise per contest

const P = new URLSearchParams(location.search);
const WHICH = P.get("p") || "1";

/* ---- three thermal ramps. Index 0 is the empty cell; 1..15 run hot to cold. -------- */
const PALETTES = {
  "1": {
    ad: "Ember",
    tema: "fire to ice",
    not: "The literal thermal reading: white-hot amber cools through orange, rust and dying "
       + "coal, then crosses into cyan and deep ink. The most saturated of the three, and the "
       + "one where a fresh hot pixel is unmistakable against an old cold field.",
    renkler: ["#FBFDFD",
      "#E4BF49","#E3A134","#DC7721","#C15325","#9A3927","#6E2828","#65353E",
      "#6F545F","#6E6883","#607E92","#287D8F","#1A5A69","#174251","#142E39","#0F1D24"]
  },
  "2": {
    ad: "Kiln",
    tema: "fired earth",
    not: "The same ramp told in materials rather than light: terracotta and ochre, through bone "
       + "and ash at the midpoint, into slate and deep blue. Muted throughout, so large filled "
       + "areas stay calm and the drawing reads before the colour does.",
    renkler: ["#FBFDFD",
      "#DAB66C","#CF9652","#C2743C","#9C553B","#73423A","#7C5950","#8B7366",
      "#968D81","#8B908E","#6F7983","#4D6478","#355168","#233D54","#15283B","#0D1926"]
  },
  "3": {
    ad: "Patina",
    tema: "copper oxidising",
    not: "Hot copper that does not merely cool but corrodes: bronze and brass turn olive, then "
       + "verdigris green, then teal and deep glass. The only one of the three that passes "
       + "through green, and the only one whose cold end still carries chroma.",
    renkler: ["#FBFDFD",
      "#DF9449","#D87A35","#C6602C","#A84C2E","#935637","#846441","#827D4A",
      "#617C49","#417549","#2F7364","#206163","#1B4D54","#173942","#122830","#0D1B21"]
  }
};
const pal = PALETTES[WHICH];

/* ---- plausible canvas content: shapes people actually draw, plus scatter ---------- */
const cells = new Int8Array(N*N).fill(0);
const heat  = new Int8Array(N*N).fill(0);
const put=(x,y,c,h)=>{ if(x<0||y<0||x>=N||y>=N)return; cells[y*N+x]=c; heat[y*N+x]=h; };
let seed=7; const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);

// a block "flag" — the thing every pixel canvas grows. Banded across the ramp so the
// hot-to-cold order is legible without reading the strip.
for(let y=8;y<20;y++) for(let x=6;x<26;x++) put(x,y, y<12?2:(y<16?8:13), 1);
// a heart, at the hot end
const heart=[[0,2],[1,1],[2,1],[3,2],[4,1],[5,1],[6,2],[0,3],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3],
             [1,4],[2,4],[3,4],[4,4],[5,4],[2,5],[3,5],[4,5],[3,6]];
heart.forEach(([x,y])=>put(38+x,10+y, 2, 3));
// a contested corridor — this is what the elevation is for. It sweeps the whole ramp,
// so the full hot-to-cold run appears once as a continuous object.
for(let x=10;x<52;x++){
  const y=34+Math.round(Math.sin(x/5)*3);
  const c=1+Math.round((x-10)/41*14);
  put(x,y, c, 2+((x*7)%4)); put(x,y+1, c, 1+((x*3)%3));
}
// a signed block, at the cold end
for(let y=44;y<54;y++) for(let x=40;x<58;x++) if((x+y)%3) put(x,y, 10+((x+y)%5), 1);
// scatter — sparse and flat. This is the tail of single placements, not a texture: heavy
// scatter reads as noise and hides the ramp, which is the thing being judged here.
for(let i=0;i<150;i++){ const x=(rnd()*N)|0, y=(rnd()*N)|0; if(!cells[y*N+x]) put(x,y, 1+((rnd()*15)|0), 0); }

/* ---- render ---------------------------------------------------------------------- */
const cv=document.getElementById("c"), g=cv.getContext("2d");
// Frame to the scene bounds rather than to a guessed offset: the diamond is N*TW wide and
// N*TH tall, and the tallest stack plus the crosshair arm is what sits above the origin.
const HEADROOM = 5*LIFT + 30;
const OX = cv.width/2;
const OY = HEADROOM;
const shade=(hex,k)=>{ // darken a css colour by k for the side faces
  const d=document.createElement("canvas").getContext("2d"); d.fillStyle=hex; const s=d.fillStyle;
  const m=s.match(/^#(..)(..)(..)$/); if(!m) return hex;
  const v=[1,2,3].map(i=>Math.round(parseInt(m[i],16)*k));
  return `rgb(${v[0]},${v[1]},${v[2]})`;
};
g.fillStyle=getComputedStyle(document.body).getPropertyValue("--plot-20"); g.fillRect(0,0,cv.width,cv.height);

// faint ground grid — the plot paper the drawing sits on
g.strokeStyle="#DCE7EB"; g.lineWidth=1;
for(let i=0;i<=N;i+=8){
  g.beginPath();
  g.moveTo(OX+(0-i)*TW/2, OY+(0+i)*TH/2); g.lineTo(OX+(N-i)*TW/2, OY+(N+i)*TH/2); g.stroke();
  g.beginPath();
  g.moveTo(OX+(i-0)*TW/2, OY+(i+0)*TH/2); g.lineTo(OX+(i-N)*TW/2, OY+(i+N)*TH/2); g.stroke();
}
// draw back-to-front so nearer tiles overlap
for(let y=0;y<N;y++) for(let x=0;x<N;x++){
  const c=cells[y*N+x]; if(!c) continue;
  const h=heat[y*N+x]*LIFT;
  const sx=OX+(x-y)*TW/2, sy=OY+(x+y)*TH/2-h;
  const top=pal.renkler[c];
  if(h>0){
    g.fillStyle=shade(top,.70);
    g.beginPath(); g.moveTo(sx-TW/2,sy+TH/2); g.lineTo(sx,sy+TH); g.lineTo(sx,sy+TH+h); g.lineTo(sx-TW/2,sy+TH/2+h); g.closePath(); g.fill();
    g.fillStyle=shade(top,.85);
    g.beginPath(); g.moveTo(sx,sy+TH); g.lineTo(sx+TW/2,sy+TH/2); g.lineTo(sx+TW/2,sy+TH/2+h); g.lineTo(sx,sy+TH+h); g.closePath(); g.fill();
  }
  g.fillStyle=top;
  g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+TW/2,sy+TH/2); g.lineTo(sx,sy+TH); g.lineTo(sx-TW/2,sy+TH/2); g.closePath(); g.fill();
}
// crosshair on the most contested cell — the shape signature, used once
let best=0,bi=0; heat.forEach((v,i)=>{ if(v>best){best=v;bi=i;} });
const bx=bi%N, by=(bi/N)|0, hx=OX+(bx-by)*TW/2, hy=OY+(bx+by)*TH/2-heat[bi]*LIFT;
g.strokeStyle=getComputedStyle(document.body).getPropertyValue("--plot-40"); g.lineWidth=1.5;
g.beginPath(); g.moveTo(hx,hy-26); g.lineTo(hx,hy+26); g.moveTo(hx-30,hy); g.lineTo(hx+30,hy); g.stroke();

/* ---- chrome ---------------------------------------------------------------------- */
document.getElementById("etiket").textContent = "palette " + WHICH + " of 3 — " + pal.tema;
document.getElementById("baslik").textContent = pal.ad;
document.getElementById("aciklama").textContent = pal.not;
document.getElementById("serit").innerHTML = pal.renkler.slice(1)
  .map((c,i)=>'<div class="cip" style="background:'+c+'"><span>'+(i+1)+'</span></div>').join("");

// contrast of every player colour against the ground
const lum=(c)=>{const d=document.createElement("canvas").getContext("2d");d.fillStyle=c;
  const m=d.fillStyle.match(/^#(..)(..)(..)$/);const v=[1,2,3].map(i=>parseInt(m[i],16)/255)
  .map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2];};
const ratio=(a,b)=>{const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05);};
const G="#EDF2F4";
const oranlar=pal.renkler.slice(1).map(c=>ratio(c,G));
document.getElementById("olcu").innerHTML =
  "<div>steps <b>" + (pal.renkler.length-1) + "</b></div>"
+ "<div>weakest vs ground <b>" + Math.min.apply(null,oranlar).toFixed(2) + ":1</b></div>"
+ "<div>strongest vs ground <b>" + Math.max.apply(null,oranlar).toFixed(2) + ":1</b></div>"
+ "<div>below 1.5:1 <b>" + oranlar.filter(r=>r<1.5).length + " of 15</b></div>";
</script>
</body>
</html>
