<!doctype html>
<html><head><meta charset="utf-8"><title>bench</title>
<style>body{margin:0;background:#EDF2F4}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="out" style="font:12px monospace"></pre>
<script>
/* Does Canvas 2D hold 60 fps for a 64x64 axonometric canvas under pan and zoom?
   Two strategies measured on the same scene:
     A  redraw every tile every frame
     B  draw the scene once to an offscreen bitmap, blit it with a transform
   B is only valid because the scene is static between placements. */
const N=64, TW=22, TH=11, LIFT=7;
const PAL=["#FBFDFD","#DF9449","#D87A35","#C6602C","#A84C2E","#935637","#846441","#827D4A",
           "#617C49","#417549","#2F7364","#206163","#1B4D54","#173942","#122830","#0D1B21"];
const cells=new Int8Array(N*N), heat=new Int8Array(N*N);
let s=7; const rnd=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
// worst case for the renderer: every cell painted, many of them raised
for(let i=0;i<N*N;i++){ cells[i]=1+((rnd()*15)|0); heat[i]=(rnd()*4)|0; }

const cv=document.getElementById("c"), g=cv.getContext("2d",{alpha:false});
const shade=(hex,k)=>{const v=[1,3,5].map(i=>Math.round(parseInt(hex.substr(i,2),16)*k));
  return "rgb("+v[0]+","+v[1]+","+v[2]+")";};
const SH70={},SH85={};
PAL.forEach(c=>{SH70[c]=shade(c,.70);SH85[c]=shade(c,.85);});

function scene(ctx,OX,OY){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const c=cells[y*N+x]; if(!c)continue;
    const h=heat[y*N+x]*LIFT, top=PAL[c];
    const sx=OX+(x-y)*TW/2, sy=OY+(x+y)*TH/2-h;
    if(h>0){
      ctx.fillStyle=SH70[top];
      ctx.beginPath();ctx.moveTo(sx-TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx,sy+TH+h);ctx.lineTo(sx-TW/2,sy+TH/2+h);ctx.fill();
      ctx.fillStyle=SH85[top];
      ctx.beginPath();ctx.moveTo(sx,sy+TH);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx+TW/2,sy+TH/2+h);ctx.lineTo(sx,sy+TH+h);ctx.fill();
    }
    ctx.fillStyle=top;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+TW/2,sy+TH/2);ctx.lineTo(sx,sy+TH);ctx.lineTo(sx-TW/2,sy+TH/2);ctx.fill();
  }
}

const W=N*TW+40, H=N*TH+5*LIFT+40;
const off=document.createElement("canvas"); off.width=W; off.height=H;
const octx=off.getContext("2d",{alpha:true});

function bench(label, draw, frames){
  return new Promise(res=>{
    const t=[]; let i=0, prev=performance.now();
    function step(){
      draw(i);
      const now=performance.now(); t.push(now-prev); prev=now; i++;
      if(i<frames) requestAnimationFrame(step);
      else { t.shift(); t.sort((a,b)=>a-b);
        res({label, p50:t[t.length>>1], p95:t[Math.floor(t.length*.95)], max:t[t.length-1]}); }
    }
    requestAnimationFrame(step);
  });
}

(async()=>{
  const FR=180;
  // A — full redraw with a moving origin and a changing zoom
  const A=await bench("A tam yeniden cizim", i=>{
    const z=1+.35*Math.sin(i/22);
    g.setTransform(z,0,0,z,0,0);
    g.fillStyle="#FBFDFD"; g.fillRect(0,0,cv.width/z,cv.height/z);
    scene(g, cv.width/2/z + 90*Math.sin(i/17), 40);
  }, FR);

  // B — one offscreen render, then blit under transform
  octx.clearRect(0,0,W,H); scene(octx, W/2, 5*LIFT+20);
  const B=await bench("B onbellekli bitmap", i=>{
    const z=1+.35*Math.sin(i/22);
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle="#FBFDFD"; g.fillRect(0,0,cv.width,cv.height);
    g.setTransform(z,0,0,z, 90*Math.sin(i/17), 0);
    g.drawImage(off,0,0);
  }, FR);

  // C — B plus one tile repainted per frame (a placement landing)
  const C=await bench("C onbellek + kare basina 1 yerlesim", i=>{
    const x=i%N, y=(i*7)%N;
    scene(octx, W/2, 5*LIFT+20);           // worst case: full invalidation
    const z=1;
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle="#FBFDFD"; g.fillRect(0,0,cv.width,cv.height);
    g.drawImage(off,0,0);
  }, 60);

  const fps=ms=>(1000/ms).toFixed(0);
  document.getElementById("out").textContent =
    [A,B,C].map(r=>`${r.label.padEnd(34)} p50 ${r.p50.toFixed(1)}ms (${fps(r.p50)} fps)  p95 ${r.p95.toFixed(1)}ms (${fps(r.p95)} fps)  max ${r.max.toFixed(1)}ms`).join("\n")
    + `\n\nhedef: p95 <= 16.7ms  ·  sahne: ${N*N} hucre, hepsi dolu, ~${cells.length + heat.filter(h=>h>0).length*2} yol/kare (A)`;
  document.title="BITTI";
})();
</script></body></html>
